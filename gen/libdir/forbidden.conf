-arch AArch64
-nprocs 2
-size 6
# the generated file name is in format `Armv8-ext-forbidden********.litmus`,
# where `********` are 8 digit numbers.
-name Armv8-ext-forbidden
-fmt 8
# present value in hex
#-hexa
# If only want to generate cycles rather than litmus tests
#-cycleonly true

# Some generated cycles reach the default limit of four instructions per process.
# Uncomment this option to allow up to six instructions per process.
#-ins *

# If `-relax` is enabled, tests will be required to have a relaxation from the list specified as its argument.
#-relax {RELAX_LIST}

### Exp-obs
## [Exp & M]; (rf & ext); [Exp & M]
-safe Rfe
## [Exp & M]; (ca & ext); [Exp & M]
-safe [Fre|Coe]

### Exp-haz-ob
## [Exp & R]; (po & same-loc); [Exp & R]; sca-class?; [Exp & R]; (ca & ext); [(Exp & W) | (Imp & (TTD & W))]; sca-class?; [(Exp & W) | (Imp & (TTD & W))]
-safe [PosRR,Fre]
-safe [PosRR,[LxSx|Amo.Safe],[LxSx|Amo.Safe]?,Coe]
-safe [Hat?,[LxSx|Amo.Safe],PosWR,Fre]
-safe [Hat?,[LxSx|Amo.Safe],PosWR,[LxSx|Amo.Safe],[LxSx|Amo.Safe]?,Coe]

### lmws
## [(Exp & M) | (Imp & (Tag & R))]; (po & same-loc); [Exp & W]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Pos*R,[LxSx|Amo.Safe]]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Pos*W]
-safe [ExpObs,Pos*R,[LxSx|Amo.Safe]]
-safe [ExpObs,Pos*W]

### dob
## addr
-safe [[DpAddrdW|DpAddr*R],@after([ExpObs|Hat])]
## data
-safe DpDatadW
## ctrl; [(Exp & W) | (Imp & (TTD & W)) | TLBI | DC.CVAU | IC]
-safe DpCtrldW
-safe [DpCtrl*R,[LxSx|Amo.Safe]]
## addr; [Exp & M]; po; [(Exp & W) | (Imp & (TTD & W))]
-safe [DpAddr,[LxSx|Amo.Safe]?,Po**R,[LxSx|Amo.Safe]]
-safe [DpAddr,[LxSx|Amo.Safe]?,Po**W]
## addr; [Exp & M]; lmrs; [(Exp & R) | (Imp & (Tag & R))]
-safe [DpAddr*R,[LxSx|Amo.Safe],PosWR,[LxSx|Amo.Safe]?]
-safe [DpAddr*W,PosWR,[LxSx|Amo.Safe]?]
## data; [Exp & M]; lmrs; [(Exp & R) | (Imp & (Tag & R))]
-safe [DpData*W,PosWR,[LxSx|Amo.Safe]?]

### IFB-ob
## [Exp & R]; ctrl; [IFB]; po
-safe [DpCtrl*R,ISB,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.Safe],DpCtrl*R,ISB,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & R]; pick-ctrl-dep; [IFB]; po
-safe [DpCtrlCsel*R,ISB,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.Safe],DpCtrlCsel*R,ISB,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & R]; addr; [Exp & M]; po; [IFB]; po
-safe [DpAddr,[LxSx|Amo.Safe]?,ISB***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & R]; pick-addr-dep; [Exp & M]; po; [IFB]; po
-safe [DpAddrCsel,[LxSx|Amo.Safe]?,ISB***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.Safe],DpAddrCsel,[LxSx|Amo.Safe]?,ISB***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]

### pob
## pick-addr-dep; [(Exp & W) | (Imp & (TTD & W)) | TLBI | DC.CVAU | IC]
-safe DpAddrCseldW
-safe [DpAddrCsel*R,[LxSx|Amo.Safe]]
## pick-data-dep
-safe [DpDataCseldW|DpDataCsel*R]
## pick-ctrl-dep; [(Exp & W) | (Imp & (TTD & W)) | TLBI | DC.CVAU | IC]
-safe DpCtrlCseldW
-safe [DpCtrlCsel*R,[LxSx|Amo.Safe]]
## pick-addr-dep; [Exp & M]; po; [(Exp & W) | (Imp & (TTD & W))]
-safe [DpAddrCsel,[LxSx|Amo.Safe]?,Po**R,[LxSx|Amo.Safe]]
-safe [DpAddrCsel,[LxSx|Amo.Safe]?,Po**W]

### bob
## [(Exp & M) | (Imp & (Tag & R))]; po; [dmb.full]; po; [(Exp & M) | (Imp & (Tag & R)) | (MMU & FAULT)]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],DMB.SY***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [ExpObs,DMB.SY***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [((Exp & R) \ NoRet) | domain([Imp & (Tag & R)]; same-instance; [(Exp & R) \ NoRet])]; po; [dmb.ld]; po; [(Exp & M) | (Imp & (Tag & R)) | (MMU & FAULT)]
-safe [[DMB.LDdRW|DMB.LD*RR],@after([ExpObs|Hat])]
-safe [DMB.LD*R*,[LxSx|Amo.Safe],@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.SafeNoReturn],DMB.LD*W*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & W]; po; [dmb.st]; po; [(Exp & W) | (MMU & FAULT)]
-safe DMB.STdWW
-safe [DMB.ST*WR,[LxSx|Amo.Safe]]
-safe [Hat?,[LxSx|Amo.Safe],DMB.ST*WR,[LxSx|Amo.Safe]]
-safe [Hat?,[LxSx|Amo.Safe],DMB.ST*WW]
## [range([Exp & (R & A)]; amo; [Exp & (W & L)])]; po; [(Exp & M) | (Imp & (Tag & R)) | (MMU & FAULT)]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Po**R,A,Amo.Safe,L,PodW*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Pod*R,A,Amo.Safe,L,PosW*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [A,Amo.Safe,L,Po*W*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [ExpObs,Po**R,A,Amo.Safe,L,PodW*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [ExpObs,Pod*R,A,Amo.Safe,L,PosW*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & (W & L)]; po; [Exp & (R & A)]
-safe [L,Po*WR,A,[LxSx|Amo.Safe]?]
-safe [Hat?,[LxSx|Amo.Safe],L,Po*WR,A,[LxSx|Amo.Safe]?]
## [(Exp & (R & A)) | (Exp & (R & Q))]; po; [(Exp & M) | (Imp & (Tag & R)) | (MMU & FAULT)]
-safe [[A|Q],Po*R*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [Hat?,[A|Q],[LxSx|Amo.Safe],Po*W*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [(Exp & M) | (Imp & (Tag & R))]; po; [Exp & (W & L)]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Po**R,[LxSx|Amo.Safe],L]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],Po**W,L]
-safe [ExpObs,Po**R,[LxSx|Amo.Safe],L]
-safe [ExpObs,Po**W,L]

### DSB-ob
## [M | DC.CVAU | IC | TLBI]; po; [dsb.full]; po; [~((Imp & (TTD & M)) | (Imp & (Instr & R)))]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],DSB.SY***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
-safe [ExpObs,DSB.SY***,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [((Exp & R) \ NoRet) | domain([Imp & (Tag & R)]; same-instance; [(Exp & R) \ NoRet])]; po; [dsb.ld]; po; [~((Imp & (TTD & M)) | (Imp & (Instr & R)))]
-safe [[DSB.LDdRW|DSB.LD*RR],@after([ExpObs|Hat])]
-safe [DSB.LD*R*,[LxSx|Amo.Safe],@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.SafeNoReturn],DSB.LD*W*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]
## [Exp & W]; po; [dsb.st]; po; [~((Imp & (TTD & M)) | (Imp & (Instr & R)))]
-safe [[DSB.STdWW|DSB.ST*WR],@after([ExpObs|Hat])]
-safe [DSB.ST*W*,[LxSx|Amo.Safe],@after([ExpObs|Hat])]
-safe [Hat?,[LxSx|Amo.Safe],DSB.ST*W*,[LxSx|Amo.Safe]?,@after([ExpObs|Hat])]

### aob
## [Exp & M]; rmw; [Exp & M]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],@after([ExpObs|Hat])]
## [Exp & M]; rmw; lmrs; [(Exp & (R & A)) | (Exp & (R & Q))]
-safe [[Hat|ExpObs],[LxSx|Amo.Safe],PosWR,[A|Q],[LxSx|Amo.Safe]?]
