include forbidde-state.conf

-variant memtag
-mix true

# If `-relax` is enabled, tests will be required to have a relaxation from the list specified as its argument.
#-relax {RELAX_LIST}
#

# We mean to label @state(EndExpM) at the beginning and
# @state(StartExpM) at the end, because it enforce a communication
# edge for other clause.
#let Exp-obs =
#   [Exp & M]; rf & ext; [Exp & M]
#   | [Exp & M]; ca & ext; [Exp & M]
-relax [@state(EndExpM) F ExpObs F @state(StartExpM)]
#let Tag-obs = [Exp & W]; rf & ext; [Imp & Tag & R]
# The ending memory write triggers implicit memory tag read.
-relax [@state(EndExpM) F Coe @state(ImpTagR)]
-relax [@state(EndExpM) F Rfe @state(ImpTagR)]
-relax [@state(ImpTagR) Coe F @state(StartExpM)]
-relax [@state(ImpTagR) Fre F @state(StartExpM)]

# The following include composite relax for [Coe|Fre T] and [T Coe|Rfe]
# because standalone leads to unwanted allowed tests.
# We manually combine `[R; Tag-obs]` or `[Tag-obs; R]`

# let addr = [Exp & R]; dtrm & po; [Rreg]; iico_data & ii_addr; [Imp & Tag & R]
# let dob = addr
-relax [DpAddr @state(ImpTagR)]
# let lmrs = [W]; ((po & same-loc) & ~(intervening(W,(po & same-loc)))); [R]
# let dob = addr; [Exp & M]; lmrs; [Exp & R | Imp & Tag & R]
-relax [DpAddr*W T PosW* @state(ImpTagR)]
# let dob = data; [Exp & M]; lmrs; [Exp & R | Imp & Tag & R]
-relax [DpData*W T PosW* @state(ImpTagR)]

#let tc-before = [Imp & Tag & R]; iico_data; [B]; iico_ctrl; [Exp & M | TagCheck & FAULT]
#let dob = [Imp & Tag & R]; tc-before; [Exp & M]; po; [Exp & W | HU]
-relax [@state(ImpTagR) Po**W]

# let bob = [Exp & M | Imp & Tag & R]; po; [dmb.full]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [@state(ImpTagR) DMB.SYd**|DMB.SYs*R @state(ImpTagR)]
-relax [@state(StartExpM) DMB.SYd**|DMB.SYs*R @state(ImpTagR)]
-relax [@state(ImpTagR) DMB.SYd**|DMB.SYs*R @state(EndExpM)]
# let bob = [Exp & (R \ NoRet) | Imp & Tag & R]; po; [dmb.ld]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [@state(ImpTagR) DMB.LDdR* @state(ImpTagR)]
-relax [@state(StartExpM) DMB.LDdR* @state(ImpTagR)]
-relax [@state(ImpTagR) DMB.LDdR* @state(EndExpM)]
#let bob = [range([A];amo;[L])]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [Rfe A Amo.Safe L Po @state(ImpTagR)]
# let bob = [A | Q]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [A|Q Po*R* @state(ImpTagR)]

# let bob = [Exp & M | Imp & Tag & R]; po; [dmb.full]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [@state(ImpTagR) DMB.SY*** @state(ImpTagR)]
-relax [@state(ImpTagR) DMB.SY*** @state(EndExpM)]
-relax [@state(StartExpM) DMB.SY*** @state(ImpTagR)]
# let bob = [Exp & (R \ NoRet) | Imp & Tag & R]; po; [dmb.ld]; po; [Exp & M | Imp & Tag & R | MMU & FAULT]
-relax [@state(ImpTagR) DMB.LD*R* @state(ImpTagR)]
-relax [@state(ImpTagR) DMB.LD*R* @state(EndExpM)]
-relax [@state(StartExpM) DMB.LD*R* @state(ImpTagR)]
# let bob = [Exp & M | Imp & Tag & R]; po; [Exp & W & L]
-relax [@state(ImpTagR) Pod*W L]

# let DSB-ob = [M | DC.CVAU | IC]; po; [dsb.full]; po; [~(Imp & TTD & M | Imp & Instr & R)]
-relax [@state(StartExpM) DSB.SY*** @state(ImpTagR)]
-relax [@state(ImpTagR) DSB.SY*** @state(EndExpM)]
-relax [@state(ImpTagR) DSB.SY*** @state(ImpTagR)]
# let DSB-ob = [(Exp & R) \ NoRet | Imp & Tag & R]; po; [dsb.ld]; po; [~(Imp & TTD & M | Imp & Instr & R)]
-relax [@state(StartExpM) DSB.LD*R* @state(ImpTagR)]
-relax [@state(ImpTagR) DSB.LD*** @state(EndExpM)|@state(ImpTagR)]
# let DSB-ob = [Exp & W]; po; [dsb.st]; po; [~(Imp & TTD & M | Imp & Instr & R)]
-relax [DSB.ST*W* @state(ImpTagR)]

# let IFB-ob = [Exp & R]; addr; [Exp & M]; po; [IFB]; po
-relax [DpAddr ISB*** @state(ImpTagR)]
# let IFB-ob = [Exp & R]; pick-addr-dep; [Exp & M]; po; [IFB]; po
-relax [DpAddrCsel ISB*** @state(ImpTagR)]
# let ctrl = [Exp & R]; basic-dep; [BCC]; po
# let IFB-ob = [Exp & R]; ctrl; [IFB]; po
# let IFB = ISB | EXC-ENTRY-IFB | EXC-RET-IFB
-relax [DpCtrl ISB @state(ImpTagR)]
# let IFB-ob = [Exp & R]; pick-ctrl-dep; [IFB]; po
# let IFB = ISB | EXC-ENTRY-IFB | EXC-RET-IFB
-relax [DpCtrlCsel ISB @state(ImpTagR)]

# `[Tag-obs; IFB-ob]`
#let tc-before = [Imp & Tag & R]; iico_data; [B]; iico_ctrl; [Exp & M | TagCheck & FAULT]
#let tc-ib = tc-before; [~(Exp & R)]
# let IFB-ob = [Imp & Tag & R]; tc-before; [Exp & M]; po; [IFB]; po
# unfolded: [Imp & Tag & R]; iico_data; [B]; iico_ctrl; [Exp & M]; po; [IFB]; po
-relax [@state(ImpTagR) ISB*** @state(EndExpM)|@state(ImpTagR)]
